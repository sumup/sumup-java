import com.diffplug.gradle.spotless.SpotlessExtension
import org.gradle.api.GradleException
import org.gradle.api.plugins.JavaPlugin
import org.gradle.api.tasks.SourceSetContainer
import org.gradle.api.tasks.javadoc.Javadoc
import org.gradle.jvm.toolchain.JavaToolchainService

plugins {
    id 'base'
    id 'com.diffplug.spotless' version '8.9.0' apply false
}

ext {
    javaVersion = JavaLanguageVersion.of(21)
    minimumRuntimeVersion = 17
    projectVersion = file('VERSION').text.trim()
    testJavaVersion = providers.gradleProperty('testJavaVersion')
        .map(JavaLanguageVersion.&of)
        .getOrElse(javaVersion)
}

if (testJavaVersion.asInt() < minimumRuntimeVersion) {
    throw new GradleException(
        "SumUp Java SDK requires Java ${minimumRuntimeVersion} or newer, " +
            "but testJavaVersion=${testJavaVersion.asInt()} was requested.")
}

allprojects {
    group = 'com.sumup'
    version = rootProject.ext.projectVersion

    repositories {
        mavenCentral()
    }
}

subprojects {
    def testJavaVersionValue = rootProject.ext.testJavaVersion
    def minRuntimeVersion = rootProject.ext.minimumRuntimeVersion

    plugins.withType(JavaPlugin).configureEach {
        project.extensions.configure(JavaPluginExtension) { javaExt ->
            javaExt.toolchain { spec ->
                spec.languageVersion.set(rootProject.ext.javaVersion)
            }
        }

        project.tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.deprecation = true
            options.release = minRuntimeVersion
        }

        project.tasks.withType(Test).configureEach {
            useJUnitPlatform()
            javaLauncher.set(project.extensions.getByType(JavaToolchainService)
                .launcherFor { launcher ->
                    launcher.languageVersion.set(testJavaVersionValue)
                })
        }
    }

    plugins.withId('com.diffplug.spotless') {
        project.extensions.configure(SpotlessExtension) { spotless ->
            spotless.java { javaExt ->
                javaExt.target('**/java/**/*.java')
                javaExt.targetExclude('build/**')
                javaExt.googleJavaFormat('1.35.0')
            }
        }
    }
}

tasks.register('codegen') {
    group = 'build'
    description = 'Regenerates the OpenAPI client with go -C codegen run . generate.'
    doLast {
        println('Run `go -C codegen run . generate` from the repo root to refresh generated sources.')
    }
}

def aggregateJavadocTask = tasks.register('aggregateJavadoc', Javadoc) { task ->
    group = 'documentation'
    description = 'Generates Javadoc for all Java subprojects.'
    destinationDir = layout.buildDirectory.dir('docs/javadoc').get().asFile
    options.addBooleanOption('Xdoclint:none', true)
    options.quiet()
}

gradle.projectsEvaluated {
    aggregateJavadocTask.configure { task ->
        def javaProjects = subprojects.findAll { project ->
            project.plugins.hasPlugin(JavaPlugin)
        }

        def mainSourceSets = javaProjects.collect { project ->
            project.extensions.getByType(SourceSetContainer).named('main').get()
        }

        task.dependsOn(javaProjects.collect { project -> project.tasks.named('javadoc') })
        task.setSource(mainSourceSets.collect { sourceSet -> sourceSet.allJava })
        task.setClasspath(task.project.files(mainSourceSets.collect { sourceSet -> sourceSet.compileClasspath }))
    }
}
