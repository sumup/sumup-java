name: Bug report
description: Report a problem in the SumUp Java SDK.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Relevant code or error output
      description: Paste a minimal code sample, stack trace, or logs if available.
      render: java
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      placeholder: e.g. 0.9.0
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: e.g. 21.0.7
  - type: input
    id: build-tool
    attributes:
      label: Build tool
      placeholder: e.g. Maven 3.9.9, Gradle 8.14
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15.5, Ubuntu 24.04
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
