name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    if: '!github.event.release.prerelease'
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5.2.0
        with:
          go-version-file: codegen/go.mod

      - name: Generate SDK
        run: go -C codegen run . generate

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v4.4.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Format SDK code
        run: ./gradlew spotlessApply

      - name: Ensure clean working tree
        run: git diff --exit-code

      - name: Build
        run: ./gradlew build

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: validate
    if: '!github.event.release.prerelease'
    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v4.4.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Publish artifacts
        run: ./gradlew :sumup-sdk:sonatypeCentralUpload
