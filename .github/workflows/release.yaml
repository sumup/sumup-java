name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    if: '!github.event.release.prerelease'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.2.0
        with:
          go-version-file: codegen/go.mod

      - name: Generate SDK
        run: go -C codegen run . generate

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v4.4.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Format SDK code
        run: ./gradlew spotlessApply

      - name: Ensure clean working tree
        run: git diff --exit-code

      - name: Build
        run: ./gradlew build

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: validate
    if: '!github.event.release.prerelease'
    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v4.4.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Publish artifacts
        run: ./gradlew :sumup-sdk:sonatypeCentralUpload
