name: Release PR Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  bump-readme:
    if: startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4.1.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Sync README dependency versions
        id: sync
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          script: |
            const fs = require('fs');
            const version = fs.readFileSync('VERSION', 'utf8').trim();
            if (!version) {
              throw new Error('VERSION file is empty');
            }

            const readmePath = 'README.md';
            const original = fs.readFileSync(readmePath, 'utf8');

            const kotlinGradlePattern = /(implementation\("com\.sumup:sumup:)([^"]+)("\))/;
            let kotlinGradleUpdated = false;
            const afterKotlinGradle = original.replace(
              kotlinGradlePattern,
              (_, prefix, _current, suffix) => {
                kotlinGradleUpdated = true;
                return `${prefix}${version}${suffix}`;
              }
            );
            if (!kotlinGradleUpdated) {
              throw new Error('Gradle (Kotlin DSL) dependency snippet not found in README.md');
            }

            const groovyGradlePattern =
              /(implementation\s+['"]com\.sumup:sumup:)([^'"]+)(['"])/;
            let groovyGradleUpdated = false;
            const afterGradle = afterKotlinGradle.replace(
              groovyGradlePattern,
              (_, prefix, _current, suffix) => {
                groovyGradleUpdated = true;
                return `${prefix}${version}${suffix}`;
              }
            );
            if (!groovyGradleUpdated) {
              throw new Error('Gradle (Groovy) dependency snippet not found in README.md');
            }

            const mavenPattern = /(<version>)([^<]+)(<\/version>)/;
            let mavenUpdated = false;
            const updated = afterGradle.replace(mavenPattern, (_, prefix, _current, suffix) => {
              mavenUpdated = true;
              return `${prefix}${version}${suffix}`;
            });
            if (!mavenUpdated) {
              throw new Error('Maven dependency snippet not found in README.md');
            }

            if (updated === original) {
              core.setOutput('updated', 'false');
              return;
            }

            fs.writeFileSync(readmePath, updated);
            core.setOutput('updated', 'true');

      - name: Commit changes
        if: steps.sync.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README dependency versions"

      - name: Push changes
        if: steps.sync.outputs.updated == 'true'
        run: git push
